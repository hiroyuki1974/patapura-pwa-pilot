name: Patapura daily push
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
permissions:
  contents: read
concurrency:
  group: patapura-personal-push
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Web Push library
        env:
          PUSH_CONFIG: ${{ secrets.PATAPURA_PUSH_CONFIG }}
        if: ${{ env.PUSH_CONFIG != '' }}
        run: npm install --no-save --ignore-scripts --no-audit --no-fund web-push@3.6.7
      - name: Send personal notification
        env:
          PUSH_CONFIG: ${{ secrets.PATAPURA_PUSH_CONFIG }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const raw=process.env.PUSH_CONFIG;
          if(!raw){console.log('Not configured. No notification sent.');process.exit(0);}
          const webpush=require('web-push');
          const app='https://hiroyuki1974.github.io/patapura-pwa-pilot/preview-step3-20261123/';
          (async()=>{
            const c=JSON.parse(raw);
            const u=new URL(c.subscription.endpoint);
            if(u.protocol!=='https:' || !u.hostname.endsWith('.push.apple.com'))throw Error('Unsupported endpoint');
            if(!c.publicKey||!c.privateKey||!c.subscription.keys?.auth||!c.subscription.keys?.p256dh)throw Error('Invalid configuration');
            const test=process.env.EVENT_NAME==='workflow_dispatch';
            const payload={web_push:8030,notification:{title:test?'パタプラ｜通知試験':'今日のパタプラ',body:test?'タップして学習アプリが開くか確認してください。':'今日も3レッスン。タップして学習を始めましょう。',lang:'ja',navigate:app,tag:'patapura-daily',app_badge:'1'}};
            await webpush.sendNotification(c.subscription,JSON.stringify(payload),{TTL:3600,urgency:'normal',contentEncoding:'aes128gcm',vapidDetails:{subject:'mailto:hiroporo.sbt@gmail.com',publicKey:c.publicKey,privateKey:c.privateKey}});
            console.log('Push accepted by the push service.');
          })().catch(e=>{console.error('Push failed; status: '+(Number.isInteger(e.statusCode)?e.statusCode:'configuration or transport error'));process.exitCode=1;});
          NODE
